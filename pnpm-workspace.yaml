allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@storybook/addon-a11y@10.6.5"
  - "@storybook/addon-docs@10.6.5"
  - "@storybook/addon-themes@10.6.5"
  - "@storybook/addon-vitest@10.6.5"
  - "@storybook/builder-vite@10.6.5"
  - "@storybook/react-dom-shim@10.6.5"
  - storybook@10.6.5
# Temporary: 2.2.1 was published inside minimumReleaseAge. Remove once it ages out.
overrides:
  mdast-util-to-markdown: 2.2.0
  # conventionalcommits@10 needs writer@9, but semantic-release@25 bundles release-notes-generator@14 (writer@8).
  # Remove once semantic-release ships release-notes-generator@15.
  conventional-changelog-writer: 9.3.0
